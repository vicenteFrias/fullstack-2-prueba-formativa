<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMEZONE - Registro</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos Propios -->
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="bg-light">

    <!-- Barra de Navegación -->
    <nav class="navbar bg-white border-bottom shadow-sm px-3 mb-4">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold text-dark text-decoration-none" href="index.html">HOME</a>
            <span class="h4 mb-0 fw-bold">GAMEZONE</span>
            <a href="index.html" class="btn btn-dark btn-sm fw-semibold">INICIAR SESIÓN</a>
        </div>
    </nav>

    <!-- Contenedor Principal -->
    <main class="container my-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <div class="card shadow-sm border">
                    <div class="card-header bg-secondary-subtle py-3">
                        <h2 class="h5 mb-0 fw-bold text-dark">Registro de usuario</h2>
                    </div>
                    
                    <div class="card-body p-4">
                        <form id="formRegistro" novalidate>

                            <!-- Nombre Completo -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-bold small">NOMBRE COMPLETO</label>
                                <input type="text" class="form-control" id="nombre" maxlength="100" placeholder="Ej: Bruno Aguilera">
                                <div class="text-danger small mt-1" id="errorNombre"></div>
                            </div>

                            <!-- Correo Institucional -->
                            <div class="mb-3">
                                <label for="correo" class="form-label fw-bold small">CORREO INSTITUCIONAL (@duoc.cl)</label>
                                <input type="email" class="form-control" id="correo" maxlength="60" placeholder="nombre@duoc.cl">
                                <div class="text-danger small mt-1" id="errorCorreo"></div>
                            </div>

                            <!-- Contraseña -->
                            <div class="mb-3">
                                <label for="password" class="form-label fw-bold small">CONTRASEÑA</label>
                                <input type="password" class="form-control" id="password" placeholder="Mínimo 10 caracteres (Mayús, Minús, Núm y Símbolo)">
                                <div class="text-danger small mt-1" id="errorPassword"></div>
                            </div>

                            <!-- Confirmar Contraseña -->
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label fw-bold small">CONFIRMAR CONTRASEÑA</label>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Repite tu contraseña">
                                <div class="text-danger small mt-1" id="errorConfirmPassword"></div>
                            </div>

                            <!-- Teléfono Opcional -->
                            <div class="mb-3">
                                <label for="telefono" class="form-label fw-bold small">TELÉFONO (OPCIONAL)</label>
                                <input type="tel" class="form-control" id="telefono" placeholder="Ej: 912345678">
                                <div class="text-danger small mt-1" id="errorTelefono"></div>
                            </div>

                            <!-- Checklist de Géneros -->
                            <div class="mb-4">
                                <label class="form-label fw-bold small d-block">GÉNEROS FAVORITOS (Selecciona al menos uno)</label>
                                <div class="p-3 border rounded bg-white">
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <div class="form-check">
                                                <input class="form-check-input check-genero" type="checkbox" value="FICCION" id="genFiccion">
                                                <label class="form-check-label small" for="genFiccion">Ficción</label>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <div class="form-check">
                                                <input class="form-check-input check-genero" type="checkbox" value="NO FICCION" id="genNoFiccion">
                                                <label class="form-check-label small" for="genNoFiccion">No Ficción</label>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <div class="form-check">
                                                <input class="form-check-input check-genero" type="checkbox" value="MISTERIO" id="genMisterio">
                                                <label class="form-check-label small" for="genMisterio">Misterio</label>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <div class="form-check">
                                                <input class="form-check-input check-genero" type="checkbox" value="TERROR" id="genTerror">
                                                <label class="form-check-label small" for="genTerror">Terror</label>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <div class="form-check">
                                                <input class="form-check-input check-genero" type="checkbox" value="SUSPENSO" id="genSuspenso">
                                                <label class="form-check-label small" for="genSuspenso">Suspenso</label>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <div class="form-check">
                                                <input class="form-check-input check-genero" type="checkbox" value="HISTORIA" id="genHistoria">
                                                <label class="form-check-label small" for="genHistoria">Historia</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="text-danger small mt-1" id="errorGeneros"></div>
                            </div>

                            <!-- Botón de Envío y Mensaje de Éxito -->
                            <button type="submit" id="btnRegistrar" class="btn btn-dark w-100 py-2 fw-bold">REGISTRAR</button>
                            <div class="alert alert-success mt-3 text-center d-none" id="mensajeExito" role="alert"></div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle y Script de Registro -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>
